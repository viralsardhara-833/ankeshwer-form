<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maiya ki Maya - with P.P. Gurumaa</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --gold: #b08d57; --gold-dark: #8a6d3b; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background: #000; color: white; overflow-x: hidden; }

    /* Optimized Background for the specific image */
    .bg-wallpaper {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      /* Replace the URL below with your actual image path if this link expires */
      background: linear-gradient(to right, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.4) 100%), 
                  url('https://replicate.delivery/yhqm/Zfef6jS8XmToakO8uM82xHeZfXqN8mI2tqfeB6uV7o5SInYNB/out-0.png') center right no-repeat;
      background-size: cover; z-index: -1; transition: filter 0.8s ease;
    }
    
    /* Mobile specific background positioning to keep face visible */
    @media (max-width: 640px) {
      .bg-wallpaper {
        background-position: 70% center; 
        background-image: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.7) 100%), 
                        url('https://replicate.delivery/yhqm/Zfef6jS8XmToakO8uM82xHeZfXqN8mI2tqfeB6uV7o5SInYNB/out-0.png');
      }
    }

    .bg-wallpaper.blurred { filter: blur(12px) brightness(0.3); }

    .stylish-heading {
      font-family: 'Cinzel', serif;
      background: linear-gradient(to bottom, #ffffff 30%, var(--gold) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 3rem;
    }

    .form-card { 
      background: white; border-radius: 24px; padding: 2rem; margin-bottom: 2rem; 
      position: relative; transition: all 0.4s ease; border: 1px solid rgba(0,0,0,0.05);
      animation: fadeInUp 0.6s ease forwards;
    }
    
    .input-field {
      width: 100%; background: #f8fafc; border: 2px solid #e2e8f0;
      border-radius: 12px; padding: 14px; font-size: 16px; outline: none; margin-top: 6px; 
      color: #1e293b;
    }
    .input-field:focus { border-color: var(--gold); background: white; }
    
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: white;
      font-weight: 800; transition: all 0.4s ease; padding: 1.2rem 3rem; border-radius: 99px; 
      display: inline-block; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 1px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="mainBg" class="bg-wallpaper"></div>

  <!-- LANDING PAGE - REPOSITIONED TEXT -->
  <section id="hero" class="h-screen flex flex-col justify-center items-center sm:items-start px-6 sm:px-20 lg:px-32">
    <div class="text-center sm:text-left mt-[-100px] sm:mt-0">
      <h1 class="stylish-heading text-5xl sm:text-7xl lg:text-8xl font-black mb-4 leading-tight">
        Maiya ki Maya<br>
        <span class="text-2xl sm:text-4xl lg:text-5xl opacity-90 block mt-2">with P.P. Gurumaa</span>
      </h1>
      <p class="text-white/70 tracking-[0.4em] text-xs sm:text-sm uppercase font-light">
        Special Spiritual Discourse
      </p>
      
      <div class="mt-10">
        <a href="#registration" class="btn-gold shadow-2xl">
          REGISTER NOW <i class="fa-solid fa-chevron-right ml-2 text-sm"></i>
        </a>
      </div>
    </div>
  </section>

  <!-- FORM SECTION -->
  <section id="registration" class="min-h-screen py-24 px-4 flex flex-col items-center">
    <div class="glass-panel w-full max-w-2xl overflow-hidden shadow-2xl">
      
      <div id="formContainer">
        <header class="py-16 text-center">
          <h2 class="stylish-heading text-4xl font-bold">Register Presence</h2>
          <p class="text-white/40 text-xs mt-2 uppercase tracking-widest">Join the divine gathering</p>
        </header>

        <div class="px-6 pb-12 sm:px-12">
          <form id="regForm">
            <div class="form-card main-member">
              <h3 class="font-bold text-slate-800 mb-8 flex items-center gap-3 text-lg">
                <span class="bg-[#b08d57] text-white w-8 h-8 rounded-full flex items-center justify-center">1</span> 
                Primary Member
              </h3>
              <div class="space-y-5">
                <div><label class="text-[11px] font-bold text-slate-400 uppercase">Full Name</label><input type="text" name="name" required class="input-field"></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase">City</label>
                    <select name="city" required class="input-field">
                      <option value="">-- Choose --</option>
                      <option value="Ankleshwar">Ankleshwar</option>
                      <option value="Bharuch">Bharuch</option>
                      <option value="Vapi">Vapi</option>
                    </select>
                  </div>
                  <div>
                    <label class="text-[11px] font-bold text-slate-400 uppercase">Mobile (10 Digits)</label>
                    <input type="tel" name="mobile" required pattern="[0-9]{10}" maxlength="10" class="input-field">
                  </div>
                </div>
                <div><label class="text-[11px] font-bold text-slate-400 uppercase">Age (18-35 Only)</label><input type="number" name="age" required min="18" max="35" class="input-field"></div>
                <div><label class="text-[11px] font-bold text-slate-400 uppercase">Full Address</label><textarea name="address" required rows="3" class="input-field"></textarea></div>
              </div>
            </div>

            <div id="additionalList"></div>

            <button type="button" id="addBtn" class="w-full py-5 border-2 border-dashed border-white/10 text-white/60 rounded-2xl mb-8 font-bold text-xs hover:border-gold hover:text-gold transition-all">
              <i class="fa-solid fa-user-plus mr-2"></i> ADD FAMILY MEMBER
            </button>

            <button type="submit" id="submitBtn" class="w-full btn-gold text-xl py-6 rounded-3xl shadow-xl">
              SUBMIT REGISTRATION
            </button>
          </form>
        </div>
      </div>

      <!-- Success Screen -->
      <div id="successScreen" class="hidden p-12 text-center py-32">
        <i class="fa-solid fa-circle-check text-8xl text-green-500 mb-8"></i>
        <h2 class="stylish-heading text-5xl font-black mb-6 uppercase">Jai Aatmeshwar</h2>
        <p class="text-white/70 text-xl mb-10">Registration confirmed successfully.</p>
        <button onclick="window.location.reload()" class="bg-white/10 px-8 py-3 rounded-full text-sm font-bold uppercase tracking-widest">Register Another</button>
      </div>

      <footer class="bg-black/40 p-8 sm:p-12 border-t border-white/5 text-center">
        <h4 class="text-gold font-black mb-4 tracking-[0.2em] text-sm uppercase">Help & Support</h4>
        <div class="space-y-2 opacity-80">
            <p><i class="fa-solid fa-phone mr-2 text-gold"></i> +91 98243 30246</p>
            <p><i class="fa-solid fa-envelope mr-2 text-gold"></i> dhyansthalinavsari@gmail.com</p>
        </div>
      </footer>
    </div>
  </section>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxdB_0qKOhSRKS2Cn_e8yQigsOF2cJe6_jrcVCMnpZv-vXa0ztIUpLZcqgxiF9p5qx0/exec";

    window.addEventListener('scroll', () => {
      const bg = document.getElementById('mainBg');
      window.scrollY > 150 ? bg.classList.add('blurred') : bg.classList.remove('blurred');
    });

    document.getElementById('addBtn').onclick = () => {
      const html = `<div class="form-card shadow-xl"><button type="button" onclick="this.parentElement.remove()" class="absolute top-6 right-6 text-slate-300 hover:text-red-500"><i class="fa-solid fa-circle-xmark text-2xl"></i></button><h3 class="font-bold text-slate-800 mb-8 flex items-center gap-3 text-lg">Family Member</h3><div class="space-y-5"><div><label class="text-[11px] font-bold text-slate-400 uppercase">Full Name</label><input type="text" name="name" required class="input-field"></div><div class="grid grid-cols-2 gap-4"><div><label class="text-[11px] font-bold text-slate-400 uppercase">City</label><select name="city" required class="input-field"><option value="Ankleshwar">Ankleshwar</option><option value="Bharuch">Bharuch</option><option value="Vapi">Vapi</option></select></div><div><label class="text-[11px] font-bold text-slate-400 uppercase">Mobile</label><input type="tel" name="mobile" required pattern="[0-9]{10}" maxlength="10" class="input-field"></div></div><div><label class="text-[11px] font-bold text-slate-400 uppercase">Age</label><input type="number" name="age" required min="18" max="35" class="input-field"></div><input type="hidden" name="address" value="PRIMARY"></div></div>`;
      document.getElementById('additionalList').insertAdjacentHTML('beforeend', html);
    };

    document.getElementById('regForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const allCards = document.querySelectorAll('.form-card');
      const primaryAddress = document.querySelector('.main-member textarea[name="address"]').value;

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-3"></i> CONFIRMING...`;

      const data = [];
      allCards.forEach((card, index) => {
        let addr = card.querySelector('[name="address"]').value;
        data.push({
          name: card.querySelector('[name="name"]').value,
          city: card.querySelector('[name="city"]').value,
          mobile: card.querySelector('[name="mobile"]').value,
          age: card.querySelector('[name="age"]').value,
          address: addr === "PRIMARY" ? primaryAddress : addr,
          type: index === 0 ? "Primary" : "Family"
        });
      });

      try {
        await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ data: data }) });
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('successScreen').classList.remove('hidden');
        window.scrollTo({ top: document.getElementById('registration').offsetTop - 50, behavior: 'smooth' });
      } catch (err) {
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('successScreen').classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
