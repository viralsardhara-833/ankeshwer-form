<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maiya ki Maya - with P.P. Gurumaa</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --gold: #b08d57; --gold-dark: #8a6d3b; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background: #000; color: white; overflow-x: hidden; }

    .bg-wallpaper {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.5) 100%), 
                  url('background.png') center right no-repeat;
      background-size: cover; z-index: -1; transition: filter 0.8s ease;
    }
    
    @media (max-width: 640px) {
      .bg-wallpaper {
        background-position: 75% center; 
        background-image: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 40%, rgba(0,0,0,0.85) 100%), 
                        url('background.png');
      }
    }

    .bg-wallpaper.blurred { filter: blur(15px) brightness(0.3); }

    .stylish-heading {
      font-family: 'Cinzel', serif;
      background: linear-gradient(to bottom, #ffffff 30%, var(--gold) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 3rem;
    }

    .form-card { 
      background: white; border-radius: 24px; padding: 2rem; margin-bottom: 2rem; 
      position: relative; transition: all 0.4s ease; border: 1px solid rgba(0,0,0,0.05);
      animation: fadeInUp 0.6s ease forwards; color: #1e293b;
    }
    
    .input-field {
      width: 100%; background: #f8fafc; border: 2px solid #e2e8f0;
      border-radius: 12px; padding: 14px; font-size: 16px; outline: none; margin-top: 6px; color: #1e293b;
    }
    .input-field:focus { border-color: var(--gold); background: white; box-shadow: 0 0 0 4px rgba(176, 141, 87, 0.1); }
    
    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: white;
      font-weight: 800; transition: all 0.4s ease; padding: 1.2rem 3rem; border-radius: 99px; 
      display: inline-block; cursor: pointer; border: none; text-transform: uppercase; letter-spacing: 2px;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body onload="checkStatus()">

  <div id="mainBg" class="bg-wallpaper"></div>

  <!-- HERO SECTION -->
  <section id="hero" class="h-screen flex flex-col justify-center items-center sm:items-start px-6 sm:px-20 lg:px-32">
    <div class="text-center sm:text-left mt-[-80px] sm:mt-0">
      <h1 class="stylish-heading text-5xl sm:text-7xl lg:text-8xl font-black mb-4 leading-tight">
        Maiya ki Maya<br>
        <span class="text-2xl sm:text-4xl lg:text-5xl opacity-90 block mt-2">with P.P. Gurumaa</span>
      </h1>
      <p class="text-white/60 tracking-[0.5em] text-[10px] sm:text-xs uppercase font-bold">Special Spiritual Discourse</p>
      
      <div class="mt-12" id="heroBtnArea">
        <a href="#registration" class="btn-gold shadow-2xl">REGISTER NOW</a>
      </div>
    </div>
  </section>

  <!-- FORM SECTION -->
  <section id="registration" class="min-h-screen py-24 px-4 flex flex-col items-center">
    <div class="glass-panel w-full max-w-2xl overflow-hidden shadow-2xl">
      
      <!-- FORM CONTAINER -->
      <div id="formContainer">
        <header class="py-16 text-center">
          <h2 class="stylish-heading text-4xl font-bold">Register Presence</h2>
        </header>

        <div class="px-6 pb-12 sm:px-12">
          <form id="regForm">
            <div class="form-card main-member shadow-lg">
              <h3 class="font-bold text-slate-800 mb-8 flex items-center gap-3 text-lg">
                <span class="bg-[#b08d57] text-white w-8 h-8 rounded-full flex items-center justify-center">1</span> Primary Member
              </h3>
              <div class="space-y-5">
                <div><label class="text-[11px] font-black text-slate-400 uppercase">Full Name</label><input type="text" name="name" required class="input-field" placeholder="Full Name"></div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label class="text-[11px] font-black text-slate-400 uppercase">Country</label>
                    <select name="city" class="input-field"><option value="India">India</option></select>
                  </div>
                  <div>
                    <label class="text-[11px] font-black text-slate-400 uppercase">Mobile (10 Digits)</label>
                    <input type="tel" name="mobile" required pattern="[0-9]{10}" maxlength="10" minlength="10" class="input-field">
                  </div>
                </div>
                <div>
                  <label class="text-[11px] font-black text-slate-400 uppercase">Select Age Group</label>
                  <select name="age" required class="input-field">
                    <option value="">-- Select Age Group --</option>
                    <option value="10 to 30 Years">10 to 30 Years</option>
                    <option value="Above 30 Years">Above 30 Years</option>
                  </select>
                </div>
                <div><label class="text-[11px] font-black text-slate-400 uppercase">Full Address</label><textarea name="address" required rows="3" class="input-field"></textarea></div>
              </div>
            </div>

            <div id="additionalList"></div>

            <button type="button" id="addBtn" class="w-full py-5 border-2 border-dashed border-white/10 text-white/60 rounded-2xl mb-8 font-bold text-xs hover:border-gold">
              <i class="fa-solid fa-user-plus mr-2"></i> ADD FAMILY MEMBER
            </button>

            <button type="submit" id="submitBtn" class="w-full btn-gold text-xl py-6 rounded-3xl shadow-xl">SUBMIT REGISTRATION</button>
          </form>
        </div>
      </div>

      <!-- CLOSED MESSAGE -->
      <div id="closedMessage" class="hidden p-20 text-center py-32">
        <i class="fa-solid fa-circle-exclamation text-8xl text-red-500 mb-8"></i>
        <h2 class="stylish-heading text-4xl font-black mb-4 uppercase">Registration Closed</h2>
        <p class="text-white/70 text-lg">We have reached the limit of 2000 registrations. Thank you for your interest!</p>
      </div>

      <!-- SUCCESS SCREEN -->
      <div id="successScreen" class="hidden p-12 text-center py-32 animate-fade-in">
        <i class="fa-solid fa-circle-check text-8xl text-green-500 mb-8"></i>
        <h2 class="stylish-heading text-5xl font-black mb-6 uppercase tracking-tight">Jai Aatmeshwar</h2>
        <p class="text-white/70 text-xl mb-10">Registration successful.</p>
        <button onclick="window.location.reload()" class="bg-white/10 px-10 py-4 rounded-full text-xs font-bold uppercase tracking-widest">Register Another</button>
      </div>

      <footer class="bg-black/60 p-10 text-center border-t border-white/5">
        <h4 class="text-gold font-black mb-6 tracking-[0.2em] text-sm uppercase">Contact Details</h4>
        <a href="tel:+919428026457" class="block hover:text-gold transition text-lg"><i class="fa-solid fa-phone mr-3 text-gold"></i> +91 94280 26457</a>
      </footer>
    </div>
  </section>

  <script>
    // USE YOUR NEW DEPLOYED URL HERE
    const WEB_APP_URL = "PASTE_YOUR_NEW_URL_HERE";

    // 1. Check if full on load
    async function checkStatus() {
        try {
            const response = await fetch(WEB_APP_URL);
            const result = await response.json();
            if (result.status === "CLOSED") {
                document.getElementById('formContainer').innerHTML = ""; // Clear form
                document.getElementById('closedMessage').classList.remove('hidden');
                document.getElementById('heroBtnArea').innerHTML = "<p class='text-red-500 font-bold'>REGISTRATION FULL</p>";
            }
        } catch (e) { console.log("Status check failed, continuing..."); }
    }

    // 2. Add Member
    document.getElementById('addBtn').onclick = () => {
      const html = `<div class="form-card shadow-xl animate-fade-in"><button type="button" onclick="this.parentElement.remove()" class="absolute top-6 right-6 text-slate-300 hover:text-red-500"><i class="fa-solid fa-circle-xmark text-2xl"></i></button><h3 class="font-bold text-slate-800 mb-8 flex items-center gap-3 text-lg">Family Member</h3><div class="space-y-5"><div><label class="text-[11px] font-black text-slate-400 uppercase">Full Name</label><input type="text" name="name" required class="input-field"></div><div class="grid grid-cols-2 gap-4"><div><label class="text-[11px] font-black text-slate-400 uppercase">Country</label><select name="city" class="input-field"><option value="India">India</option></select></div><div><label class="text-[11px] font-black text-slate-400 uppercase">Mobile</label><input type="tel" name="mobile" required pattern="[0-9]{10}" maxlength="10" minlength="10" class="input-field"></div></div><div><label class="text-[11px] font-black text-slate-400 uppercase">Age Group</label><select name="age" required class="input-field"><option value="10 to 30 Years">10 to 30 Years</option><option value="Above 30 Years">Above 30 Years</option></select></div><input type="hidden" name="address" value="SAME_AS_PRIMARY"></div></div>`;
      document.getElementById('additionalList').insertAdjacentHTML('beforeend', html);
    };

    // 3. Submit Form
    document.getElementById('regForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const allCards = document.querySelectorAll('.form-card');
      const primaryAddress = document.querySelector('.main-member textarea[name="address"]').value;

      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin mr-3"></i> CONFIRMING...`;

      const dataArray = [];
      allCards.forEach((card, index) => {
        let addr = card.querySelector('[name="address"]').value;
        dataArray.push({
          name: card.querySelector('[name="name"]').value,
          city: card.querySelector('[name="city"]').value,
          mobile: card.querySelector('[name="mobile"]').value,
          age: card.querySelector('[name="age"]').value,
          address: addr === "SAME_AS_PRIMARY" ? primaryAddress : addr,
          type: index === 0 ? "Primary" : "Family Member"
        });
      });

      try {
        const resp = await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ data: dataArray }) });
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('successScreen').classList.remove('hidden');
      } catch (err) {
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('successScreen').classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
