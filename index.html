<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maiya ki Maya - Registration Closed</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --gold: #b08d57; --gold-dark: #8a6d3b; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; background: #000; color: white; overflow-x: hidden; }

    .bg-wallpaper {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.85) 100%), 
                  url('background.png') center right no-repeat;
      background-size: cover; z-index: -1; filter: blur(10px) brightness(0.4);
    }

    .stylish-heading {
      font-family: 'Cinzel', serif;
      background: linear-gradient(to bottom, #ffffff 30%, var(--gold) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 3rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .btn-gold {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: white;
      font-weight: 800; padding: 1.2rem 3rem; border-radius: 99px; 
      display: inline-block; text-transform: uppercase; letter-spacing: 2px;
      opacity: 0.6; cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="bg-wallpaper"></div>

  <!-- HERO SECTION -->
  <section class="h-screen flex flex-col justify-center items-center px-6 text-center">
    <div>
      <h1 class="stylish-heading text-5xl sm:text-7xl lg:text-8xl font-black mb-4 leading-tight">
        Maiya ki Maya<br>
        <span class="text-2xl sm:text-4xl lg:text-5xl opacity-90 block mt-2">with P.P. Gurumaa</span>
      </h1>
      <p class="text-white/60 tracking-[0.5em] text-[10px] sm:text-xs uppercase font-bold mb-10">Special Spiritual Discourse</p>
      
      <div class="inline-block px-8 py-3 border border-red-500/50 bg-red-500/10 rounded-full text-red-500 font-bold uppercase tracking-widest text-sm animate-pulse">
        Registration is officially over
      </div>
    </div>
  </section>

  <!-- CLOSED MESSAGE SECTION -->
  <section class="min-h-[60vh] py-10 px-4 flex flex-col items-center justify-center">
    <div class="glass-panel w-full max-w-2xl p-12 sm:p-20 text-center shadow-2xl">
      
      <div class="mb-8">
        <i class="fa-solid fa-clock-rotate-left text-7xl text-gold opacity-50"></i>
      </div>
      
      <h2 class="stylish-heading text-4xl font-bold mb-6 uppercase tracking-tight">Jai Aatmeshwar</h2>
      
      <p class="text-white/80 text-xl leading-relaxed mb-8">
        Thank you for your overwhelming response. The registration for this event is now <span class="text-gold font-bold">CLOSED</span> as we have reached our maximum capacity.
      </p>

      <div class="w-full h-[1px] bg-white/10 mb-8"></div>

      <h4 class="text-gold font-black mb-6 tracking-[0.2em] text-sm uppercase">Contact Details</h4>
      <div class="space-y-4 opacity-90 text-lg">
          <a href="tel:+919428026457" class="block hover:text-gold transition">
              <i class="fa-solid fa-phone mr-3 text-gold"></i> +91 94280 26457
          </a>
      </div>

      <div class="mt-12 pt-8 border-t border-white/5 opacity-20 text-[9px] uppercase tracking-[0.3em]">
          &copy; 2024 Maiya Ki Maya
      </div>
    </div>
  </section>

</body>
</html>
