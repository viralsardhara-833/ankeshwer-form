<script>
const WEB_APP_URL = "YOUR_DEPLOYED_URL_HERE";
let memberCount = 1;

// Function to add more members
document.getElementById('addBtn').addEventListener('click', () => {
    memberCount++;
    const html = `
    <div class="form-card mt-4 border-t-2 border-dashed border-gray-200 pt-6">
        <h3 class="font-bold text-slate-800 mb-6 flex items-center gap-2">
            <span class="bg-gray-400 text-white w-6 h-6 rounded-full text-xs flex items-center justify-center">${memberCount}</span> 
            Additional Member
        </h3>
        <div class="space-y-4">
            <div><label class="label-text">Full Name</label><input type="text" required class="input-field name-field"></div>
            <div>
                <label class="label-text">Select City</label>
                <select required class="input-field city-field">
                    <option value="Ankleshwar">Ankleshwar</option>
                    <option value="Bharuch">Bharuch</option>
                    <option value="Vapi">Vapi</option>
                </select>
            </div>
            <div><label class="label-text">Mobile Number</label><input type="tel" required pattern="[0-9]{10}" class="input-field mobile-field"></div>
            <div><label class="label-text">Age (18-35)</label><input type="number" required min="18" max="35" class="input-field age-field"></div>
            <input type="hidden" class="address-field" value="Same as Primary">
        </div>
    </div>`;
    document.getElementById('additionalList').insertAdjacentHTML('beforeend', html);
});

// Submit Logic
document.getElementById('regForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const originalText = btn.innerText;
    
    btn.disabled = true; 
    btn.innerText = "SAVING...";

    const data = [];
    
    // 1. Get Primary Member
    data.push({
        name: document.getElementById('name1').value,
        city: document.getElementById('city1').value,
        mobile: document.getElementById('mobile1').value,
        age: document.getElementById('age1').value,
        address: document.getElementById('address1').value,
        type: "Primary"
    });

    // 2. Get Additional Members
    document.querySelectorAll('#additionalList .form-card').forEach(card => {
        data.push({
            name: card.querySelector('.name-field').value,
            city: card.querySelector('.city-field').value,
            mobile: card.querySelector('.mobile-field').value,
            age: card.querySelector('.age-field').value,
            address: document.getElementById('address1').value, // Use primary address
            type: "Family"
        });
    });

    try {
        // We use the 'no-cors' mode for Google Apps Script
        await fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({ event: "Maiya ki Maya", data: data })
        });
        
        // Since no-cors doesn't return a response, we assume success if no error is thrown
        alert("Registration Successful!");
        window.location.reload();
    } catch (err) {
        console.error(err);
        alert("Connection error. Please check your internet.");
        btn.disabled = false; 
        btn.innerText = originalText;
    }
};
</script>
